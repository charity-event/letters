<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>反诈演练提示</title>
<style>
  :root { --red:#c62828; --red-bg:#fff3f3; --ink:#1f2328; --muted:#5f6b7a; --line:#e6e8eb; --card:#fff; --bg:#f6f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; -webkit-text-size-adjust:100%; }
  main { max-width:640px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:24px; line-height:1.3; margin:8px 0 12px; }
  .lead { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  .counter { text-align:center; background:var(--red-bg); border-color:#f3c3c3; }
  .counter .label { color:var(--muted); font-size:14px; }
  .counter .num { font-size:64px; font-weight:800; color:var(--red); line-height:1.1; margin:6px 0; font-variant-numeric:tabular-nums; }
  .counter .note { font-size:13px; color:var(--muted); min-height:1.5em; margin-top:6px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>恭喜你！你被骗了！</h1>
  <p class="lead">你在推送里看到"公益活动"的二维码，没有核实来源就扫了码。真实的诈骗，往往就从这一步开始。</p>

  <section class="card counter" aria-live="polite">
    <div class="label">你是本次演练中第</div>
    <div class="num" id="num">…</div>
    <div class="label">位扫码的人</div>
    <div class="note" id="note"></div>
  </section>
</main>

<!-- Vercount 脚本会把数字写进这些 span，页面上不显示，只供下面的脚本读取。 -->
<div class="hidden" aria-hidden="true">
  <span id="vercount_value_site_pv"></span>
  <span id="vercount_value_site_uv"></span>
  <span id="vercount_value_page_pv"></span>
</div>

<script>
(function () {
  // ====== 可调配置 ======
  // 用哪个数字当编号：site_pv = 整个域名下的总访问次数；page_pv = 只算这个页面；site_uv = 独立访客数。
  var COUNTER_FIELD = 'site_pv';
  // 正式发布前你自己测试产生的访问次数，显示时会减掉。例如测试了 12 次就填 12。
  var COUNT_OFFSET = 0;
  // 等 Vercount 返回数字的最长时间（毫秒），超时显示横杠
  var TIMEOUT_MS = 12000;
  // ======================

  var VERCOUNT_JS = 'https://events.vercount.one/js';
  var FAIL_TEXT = '计数服务暂时不可用，但你确实扫了码。';

  var numEl = document.getElementById('num');
  var noteEl = document.getElementById('note');
  var KEY = 'fz_no';
  var done = false;

  function show(no, note) {
    numEl.textContent = no;
    noteEl.textContent = note || '';
  }

  function finish(raw) {
    if (done) return;
    done = true;
    var n = parseInt(String(raw).replace(/[^\d]/g, ''), 10);
    if (isNaN(n)) { show('—', FAIL_TEXT); return; }
    var no = Math.max(1, n - COUNT_OFFSET);
    try { localStorage.setItem(KEY, String(no)); } catch (e) {}
    show(String(no), '');
  }

  function fail() {
    if (done) return;
    done = true;
    show('—', FAIL_TEXT);
  }

  function readSaved() {
    try {
      var v = localStorage.getItem(KEY);
      return v && /^\d+$/.test(v) ? v : null;
    } catch (e) { return null; }
  }

  function isPreviewHost() {
    var h = location.hostname;
    return location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' ||
      /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
  }

  // Vercount：动态加载官方脚本（它会自动上报并把数字写进隐藏的 span），这里等着读出来
  function fetchVercount() {
    var target = document.getElementById('vercount_value_' + COUNTER_FIELD);
    function tryRead() {
      if (done) return;
      var raw = (target.textContent || '').replace(/[^\d]/g, '');
      if (raw) finish(raw);
    }
    if (window.MutationObserver) {
      new MutationObserver(tryRead).observe(target, { childList: true, characterData: true, subtree: true });
    }
    var poll = setInterval(function () { tryRead(); if (done) clearInterval(poll); }, 300);
    setTimeout(function () { clearInterval(poll); fail(); }, TIMEOUT_MS);
    var s = document.createElement('script');
    s.src = VERCOUNT_JS;
    s.async = true;
    s.onerror = fail;
    document.head.appendChild(s);
  }

  // 1. 本机已有编号：直接显示，不再请求计数服务，刷新就不会重复计数
  var saved = readSaved();
  if (saved) { show(saved, '你之前已经扫过一次，编号保持不变。'); return; }

  // 2. 本地预览：不碰线上计数，给一个模拟数字
  if (isPreviewHost()) {
    show(String(Math.floor(Math.random() * 200) + 1), '本地预览模式，数字为模拟值。');
    return;
  }

  // 3. 正式环境
  fetchVercount();
})();
</script>
</body>
</html>
